# Rulesets require one check only: `check`, the gate over every job below.
# release.yml ships a tag only when this workflow's `check` passed for its commit on main,
# so pushes to main always run everything; docs-only PRs skip fuse and e2e.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # code=false only for a PR touching nothing but docs/** and *.md.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its base parent
      - id: diff
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$files" ]; then
              code=false
              while IFS= read -r f; do
                case "$f" in docs/* | *.md) ;; *) code=true ;; esac
              done <<< "$files"
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      # gofmt, vet, golangci-lint, unit tests, csi-sanity (test/sanity), helm lint
      - run: mise run check

  workflows:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: zizmor --format=github .github/workflows
      - run: actionlint

  fuse:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run test:fuse

  e2e:
    # PRs (non-draft, not docs-only) and main; not manual branch runs.
    needs: changes
    if: >-
      ${{ needs.changes.outputs.code == 'true'
      && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run e2e
      - name: Collect logs
        if: failure()
        run: |
          out="$RUNNER_TEMP/e2e-logs"
          mkdir -p "$out"
          kind export logs --name csi-rclone-e2e "$out/kind" || true
          kubectl cluster-info dump --all-namespaces --output-directory "$out/cluster" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7

  check:
    if: always()
    needs: [changes, test, workflows, fuse, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions: {}
    steps:
      # A skipped job reports success; failed or cancelled ones must keep the gate red.
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
