# Rulesets require one check only: `check`, the gate over every job below.
# e2e (kind, ~6-10 min) never runs on PRs or pushes: weekly on main, manual runs (Run workflow
# on any branch, also a PR's; its `check` then reports on the PR head) and every
# release (release.yml calls this workflow with e2e: true, release: true). PRs run only matching
# code and lint areas; main runs every area. release.yml also needs this workflow's `check` on main.
# Go caches: restored except in release runs; saved from main pushes (e2e: also schedule), never PRs or releases.
# Keyed on go.sum: dependencies dominate compile time and change only with it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC, e2e on main
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the kind e2e suite
        type: boolean
        default: true
  workflow_call:
    inputs:
      e2e:
        type: boolean
        default: false
      release:
        description: Release run; restores and saves no caches
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.ref }}${{ inputs.release && '-release' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.221.1"

jobs:
  # ci.yml selects both areas; docs and Renovate-only changes skip code checks.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      lint: ${{ steps.diff.outputs.lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its base parent
      - id: diff
        run: |
          code=true
          lint=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            code=false
            lint=false
            files=$(git diff --no-renames --name-only -z HEAD^1 HEAD | xargs -0 -n1 printf '%s\n')
            while IFS= read -r f; do
              case "$f" in
                docs/* | *.md | LICENSE) ;;
                .github/workflows/ci.yml) code=true; lint=true ;;
                mise.toml) code=true; lint=true ;;
                .github/* | renovate.json | renovate.json5) lint=true ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          { echo "code=$code"; echo "lint=$lint"; } | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: ${{ !inputs.release }} # no cache in release runs
          cache_save: ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - id: go-dirs
        run: |
          { echo "path<<EOF"; go env GOMODCACHE GOCACHE; echo "$HOME/.cache/golangci-lint"; echo EOF; } >> "$GITHUB_OUTPUT"
      - id: go-cache
        if: ${{ !inputs.release }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-dirs.outputs.path }}
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-
      # gofmt, vet, golangci-lint, unit tests, csi-sanity (test/sanity), helm lint
      - run: mise run check
      - if: >-
          ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push'
          && !inputs.release && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-dirs.outputs.path }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  workflows:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache_save: false # lint-only install set; don't write the shared key
      - run: zizmor --format=github .github/workflows
      - run: actionlint
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  fuse:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: ${{ !inputs.release }} # no cache in release runs
          cache_save: ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - id: go-dirs
        run: |
          { echo "path<<EOF"; go env GOMODCACHE GOCACHE; echo "$HOME/.cache/golangci-lint"; echo EOF; } >> "$GITHUB_OUTPUT"
      - id: go-cache
        if: ${{ !inputs.release }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-dirs.outputs.path }}
          key: go-fuse-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-fuse-${{ runner.os }}-${{ runner.arch }}-
      # Runner has /dev/fuse and passwordless sudo: no container, cached compile.
      - run: mise run test:fuse:host
      - if: >-
          ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push'
          && !inputs.release && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-dirs.outputs.path }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  e2e:
    # Never on PRs or pushes: schedule, manual run (input e2e), release (workflow_call e2e: true).
    needs: changes
    if: >-
      ${{ needs.changes.outputs.code == 'true'
      && (github.event_name == 'schedule' || inputs.e2e) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: ${{ !inputs.release }} # no cache in release runs
          cache_save: ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - id: go-dirs
        run: |
          { echo "path<<EOF"; go env GOMODCACHE GOCACHE; echo "$HOME/.cache/golangci-lint"; echo EOF; } >> "$GITHUB_OUTPUT"
      - id: go-cache
        if: ${{ !inputs.release }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-dirs.outputs.path }}
          key: go-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-e2e-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run e2e
      - if: >-
          ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'schedule')
          && !inputs.release && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-dirs.outputs.path }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - name: Collect logs
        if: failure()
        run: |
          out="$RUNNER_TEMP/e2e-logs"
          mkdir -p "$out"
          kind export logs --name csi-rclone-e2e "$out/kind" || true
          kubectl cluster-info dump --all-namespaces --output-directory "$out/cluster" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7

  check:
    if: always()
    needs: [changes, test, workflows, fuse, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions: {}
    steps:
      # A skipped job reports success; failed or cancelled ones must keep the gate red.
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
