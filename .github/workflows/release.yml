# Tag vX.Y.Z → image tags x.y.z, x.y, latest, the OCI chart, a GitHub release. The tag must equal
# the chart version and appVersion. Manual run on a branch → image tag `edge` only.
# One job builds the amd64 + arm64 index: Go cross-compiles on the runner, no QEMU.
# Images and the chart are signed keyless with cosign (GitHub OIDC).
# A tag ships only a commit on main whose CI run (ci.yml on main) passed `check`, and the
# full CI including e2e passes again on the tag (job `ci`, no caches restored for tags).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/blackdark/csi-driver-rclone
  CHART_REPO: oci://ghcr.io/blackdark/csi-driver-rclone/charts

jobs:
  # Full CI including e2e on the tag commit: e2e is not part of every main push.
  ci:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] actionlint rejects $/ syntax
    permissions:
      contents: read
    with:
      e2e: false # TODO: back to true once the chart release works end to end

  # The tag commit is on main and CI on main passed for it; waits while that run is in progress.
  main-ci:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
      - name: CI on main passed for the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash hack/release/check-main-ci.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"

  version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash hack/release/check-version.sh "$GITHUB_REF_NAME"

  # One job: the Dockerfile cross-compiles on the build platform (CGO off) and the final stage is
  # COPY only, so arm64 needs no QEMU or arm runner.
  image:
    needs: [ci, main-ci, version]
    if: >-
      ${{ !cancelled() && needs.ci.result == 'success'
      && needs.main-ci.result != 'failure' && needs.version.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="edge-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest follows semver tags (flavor latest=auto); edge only for manual runs.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the index
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  chart:
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false # no cache restored into a publishing job
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package, push and sign
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin <<< "$REGISTRY_TOKEN"
          cosign login ghcr.io -u "$REGISTRY_USER" --password-stdin <<< "$REGISTRY_TOKEN"
          pkg=$(helm package charts/csi-driver-rclone -d "$RUNNER_TEMP" | sed -n 's/^Successfully packaged chart and saved it to: //p')
          out=$(helm push "$pkg" "$CHART_REPO" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          digest=$(sed -n 's/^Digest: *//p' <<< "$out")
          [ -n "$digest" ] || { echo "::error::no digest in helm push output"; exit 1; }
          cosign sign --yes "${CHART_REPO#oci://}/csi-driver-rclone@$digest"

  release:
    needs: chart
    if: ${{ !cancelled() && needs.chart.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
