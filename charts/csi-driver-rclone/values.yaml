# Driver image; also used for Mount Pods (`mount` mode).
image:
  repository: ghcr.io/blackdark/csi-driver-rclone
  # Defaults to the chart appVersion.
  tag: ""
  # Optional; when set the image is referenced as repository@digest.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Host path of the kubelet root dir; k0s and some distros differ.
kubeletDir: /var/lib/kubelet

# Host dir holding the default hostPath Caches, one subdir per volume.
cacheRoot: /var/lib/rclone-csi/cache

logLevel: info

node:
  # How long NodePublishVolume waits for a Mount Pod to become ready.
  publishTimeout: 2m
  priorityClassName: system-node-critical
  # Must exceed the drain of a Mount Pod being torn down by the plugin.
  terminationGracePeriodSeconds: 30
  tolerations:
    - operator: Exists
  nodeSelector: {}
  affinity: {}
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}

# Controller: unprivileged Deployment behind external-provisioner, for Dynamic Volumes.
controller:
  # One active replica; extra replicas wait on the leader election lease.
  replicas: 1
  # Pod port the liveness-probe sidecar serves on.
  livenessProbePort: 9808
  priorityClassName: ""
  tolerations: []
  nodeSelector: {}
  affinity: {}
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi
  podAnnotations: {}

# Optional StorageClass for Dynamic Volumes. Each PVC mounts remotePath with
# ${pvc.namespace}, ${pvc.name} and ${pv.name} filled in; the secret must not set remotePath.
storageClass:
  enabled: false
  name: rclone
  default: false
  # Delete removes only the PV object: DeleteVolume never touches remote data.
  reclaimPolicy: Delete
  # Credential Secret for NodePublishVolume; namespace may be "${pvc.namespace}".
  secret:
    name: ""
    namespace: ""
  # Volume context keys (docs/reference/volume-parameters.md); remotePath is required.
  parameters: {}
  #   remote: s3
  #   remotePath: my-bucket/${pvc.namespace}/${pvc.name}
  #   vfs-cache-mode: writes

# Mount Pods are created by the node plugin, one per (volume, node).
mountPod:
  # Non-root uid/gid the Mount Pod runs as (ADR 0002).
  uid: 65532
  gid: 65532
  priorityClassName: system-node-critical
  # How long an unused Mount Pod stays up after the last workload pod on its node
  # leaves; a publish within it reuses the Mount Pod. 0s stops it at once.
  linger: 2m
  # Bound on draining pending uploads when a Mount Pod stops. Its
  # terminationGracePeriodSeconds is drainTimeout + unmountWait + 10s.
  drainTimeout: 5m
  # Mount Pod wait for the node plugin's unmount after draining.
  unmountWait: 30s
  tolerations:
    - operator: Exists

# Prometheus metrics (docs/reference/metrics.md). The endpoints are unauthenticated
# plain HTTP inside the cluster; restrict them with a NetworkPolicy if needed.
metrics:
  # Node plugin and controller /metrics; Mount Pods always serve theirs on 9810.
  enabled: true
  port: 9809
  # Prometheus Operator objects; need the monitoring.coreos.com/v1 CRDs.
  # ServiceMonitor: node plugin and controller, through a headless metrics Service.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # PodMonitor: Mount Pods.
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # Grafana dashboard ConfigMap for the Grafana sidecar.
  dashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
    annotations: {}

sidecars:
  nodeDriverRegistrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.14.0@sha256:5244abbe87e01b35adeb8bb13882a74785df0c0619f8325c9e950395c3f72a97
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0@sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  livenessProbe:
    image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0@sha256:06da0d5b8908072f2e4522692aee8dc119fba7247a9658497e1153992cd777e9
    # Pod port the probe serves on; the pod has no hostNetwork.
    port: 9808
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
