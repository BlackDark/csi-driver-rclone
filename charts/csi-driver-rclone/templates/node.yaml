{{- $pluginDir := include "csi-driver-rclone.pluginDir" . -}}
{{- $sock := printf "%s/csi.sock" $pluginDir -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "csi-driver-rclone.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-driver-rclone.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      {{- include "csi-driver-rclone.nodeSelectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "csi-driver-rclone.nodeSelectorLabels" . | nindent 8 }}
      {{- with .Values.node.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "csi-driver-rclone.fullname" . }}-node
      priorityClassName: {{ .Values.node.priorityClassName }}
      terminationGracePeriodSeconds: {{ .Values.node.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rclone
          image: {{ include "csi-driver-rclone.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - node
            - --endpoint=unix://{{ $sock }}
            - --kubelet-dir={{ .Values.kubeletDir }}
            - --cache-root={{ .Values.cacheRoot }}
            - --mount-image={{ include "csi-driver-rclone.image" . }}
            - --mount-uid={{ .Values.mountPod.uid }}
            - --mount-gid={{ .Values.mountPod.gid }}
            - --mount-priority-class={{ .Values.mountPod.priorityClassName }}
            - --mount-tolerations={{ .Values.mountPod.tolerations | default .Values.node.tolerations | toJson }}
            - --mount-resources={{ .Values.mountPod.resources | toJson }}
            - --publish-timeout={{ .Values.node.publishTimeout }}
            - --linger={{ .Values.mountPod.linger }}
            - --drain-timeout={{ .Values.mountPod.drainTimeout }}
            - --unmount-wait={{ .Values.mountPod.unmountWait }}
            - --heal-workloads={{ .Values.mountPod.healWorkloads.enabled }}
            - --log-level={{ .Values.logLevel }}
            - --metrics-addr={{ if .Values.metrics.enabled }}:{{ .Values.metrics.port }}{{ end }}
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # Root + privileged: /dev/fuse, mount(2) and Bidirectional propagation (ADR 0002).
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
            - name: healthz
              containerPort: {{ .Values.sidecars.livenessProbe.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
          volumeMounts:
            - name: plugin-dir
              mountPath: {{ $pluginDir }}
              mountPropagation: Bidirectional
            - name: pods-dir
              mountPath: {{ .Values.kubeletDir }}/pods
              mountPropagation: Bidirectional
            - name: cache-root
              mountPath: {{ .Values.cacheRoot }}
            - name: dev-fuse
              mountPath: /dev/fuse
        - name: node-driver-registrar
          image: {{ .Values.sidecars.nodeDriverRegistrar.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ $sock }}
          securityContext: &sidecarSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            exec:
              command: [/csi-node-driver-registrar, --kubelet-registration-path={{ $sock }}, --mode=kubelet-registration-probe]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
          resources:
            {{- toYaml .Values.sidecars.nodeDriverRegistrar.resources | nindent 12 }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: {{ .Values.sidecars.livenessProbe.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:{{ .Values.sidecars.livenessProbe.port }}
          securityContext: *sidecarSecurity
          resources:
            {{- toYaml .Values.sidecars.livenessProbe.resources | nindent 12 }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
      volumes:
        - name: plugin-dir
          hostPath:
            path: {{ $pluginDir }}
            type: DirectoryOrCreate
        - name: pods-dir
          hostPath:
            path: {{ .Values.kubeletDir }}/pods
            type: Directory
        - name: registration-dir
          hostPath:
            path: {{ .Values.kubeletDir }}/plugins_registry
            type: Directory
        - name: cache-root
          hostPath:
            path: {{ .Values.cacheRoot }}
            type: DirectoryOrCreate
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
