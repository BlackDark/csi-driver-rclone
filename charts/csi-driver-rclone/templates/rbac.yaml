apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "csi-driver-rclone.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-driver-rclone.labels" . | nindent 4 }}
---
# Mount Pods and their owned Secrets live in the release namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "csi-driver-rclone.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-driver-rclone.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, secrets]
    verbs: [get, list, watch, create, delete]
  # patch: the users annotation on Mount Pods (docs/design/mount-pod-contract.md).
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "csi-driver-rclone.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-driver-rclone.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "csi-driver-rclone.fullname" . }}-node
subjects:
  - kind: ServiceAccount
    name: {{ include "csi-driver-rclone.fullname" . }}-node
    namespace: {{ .Release.Namespace }}
---
# Drain-timeout and MountLost Events go on the workload pod, which may be in any namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "csi-driver-rclone.fullname" . }}-node
  labels:
    {{- include "csi-driver-rclone.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  {{- if .Values.mountPod.healWorkloads.enabled }}
  # Workload healing (mountPod.healWorkloads): evict pods whose Mount Pod was lost.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "csi-driver-rclone.fullname" . }}-node
  labels:
    {{- include "csi-driver-rclone.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "csi-driver-rclone.fullname" . }}-node
subjects:
  - kind: ServiceAccount
    name: {{ include "csi-driver-rclone.fullname" . }}-node
    namespace: {{ .Release.Namespace }}
