apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "csi-driver-rclone.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-driver-rclone.labels" . | nindent 4 }}
---
# Mount Pods and their owned Secrets live in the release namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "csi-driver-rclone.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-driver-rclone.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, secrets]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "csi-driver-rclone.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-driver-rclone.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "csi-driver-rclone.fullname" . }}-node
subjects:
  - kind: ServiceAccount
    name: {{ include "csi-driver-rclone.fullname" . }}-node
    namespace: {{ .Release.Namespace }}
