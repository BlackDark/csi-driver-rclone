[tools]
go = "1.27.3"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:zizmorcore/zizmor" = "1.31.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
helm = "4.3.1"
kubectl = "1.37.2"
"aqua:kubernetes-sigs/kind" = "0.33.0"

[tasks.check]
description = "Everything CI checks"
run = [
  # go list skips gitignored refs/ (own go.mod); raw block escapes mise templating
  '{% raw %}out=$(gofmt -l $(go list -f "{{.Dir}}" ./...)); test -z "$out" || { echo "$out"; exit 1; }{% endraw %}',
  "go vet ./...",
  "golangci-lint run",
  "go test ./...",
  "helm lint --strict charts/csi-driver-rclone",
  "helm template t charts/csi-driver-rclone > /dev/null",
  "helm template t charts/csi-driver-rclone --set mountPod.healWorkloads.enabled=true | grep -q 'pods/eviction'",
  "helm template t charts/csi-driver-rclone --api-versions monitoring.coreos.com/v1 --set metrics.serviceMonitor.enabled=true --set metrics.podMonitor.enabled=true --set metrics.dashboard.enabled=true > /dev/null",
]

[tasks."test:fuse"]
description = "FUSE handoff + mount2 integration test in a privileged-enough Linux container"
run = '''
docker run --rm --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
  -v "$PWD":/src -w /src -v csi-driver-rclone-gomod:/go/pkg/mod -v csi-driver-rclone-gocache:/root/.cache/go-build \
  golang:{{ tools.go.version }} \
  go test -tags fuse_integration -run TestFuse -count=1 -v ./internal/rclonemount/
'''

[tasks.e2e]
description = "kind + MinIO e2e: bring up cluster, install chart, run test/e2e"
run = [
  "bash hack/e2e/up.sh",
  "go test -tags e2e -count=1 -v -timeout 25m ./test/e2e/",
]

[tasks."e2e:down"]
description = "Delete the e2e kind cluster"
run = "kind delete cluster --name csi-rclone-e2e"
