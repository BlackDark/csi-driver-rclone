# Single-node MinIO for e2e only; static credentials, no persistence.
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
spec:
  replicas: 1
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest@sha256:548147b5fc95a67e3e45285dff7e0e50326c3eb1977c6218039461771156c5e7
          imagePullPolicy: IfNotPresent
          args: [server, /data]
          env:
            - {name: MINIO_ROOT_USER, value: e2e-access}
            - {name: MINIO_ROOT_PASSWORD, value: e2e-secret-key}
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  selector: {app: minio}
  ports:
    - port: 9000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: make-bucket
  namespace: minio
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: cgr.dev/chainguard/minio-client:latest@sha256:328ad584835c07ff4b28418aa54d9d9a83893b86bc543436c910359cca76ce19
          imagePullPolicy: IfNotPresent
          args: [mb, --ignore-existing, e2e/e2e-bucket]
          env:
            - {name: HOME, value: /tmp}
            - {name: MC_HOST_e2e, value: "http://e2e-access:e2e-secret-key@minio.minio.svc:9000"}
